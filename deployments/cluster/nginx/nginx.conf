# Nginx 负载均衡（单机集群版）：通过 Docker 内置 DNS 动态发现 master / slave 副本
# 需要 nginx >= 1.27.3（upstream server 的 resolve 参数）
worker_processes auto;
events { worker_connections 8192; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time upstream=$upstream_addr node=$upstream_http_x_gateway_node';
    access_log /var/log/nginx/access.log main;

    # Docker 内置 DNS；--scale 扩缩容后 10 秒内生效
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream llm_gateway {
        zone llm_gateway 64k;
        least_conn;  # 大模型请求耗时差异大，按最少连接分发比轮询更均衡
        # master 还承担定时任务，权重略低（参考 New API 集群部署：master 3 / slave 5）
        server gateway-master:8080 resolve weight=3 max_fails=3 fail_timeout=10s;
        server gateway-slave:8080  resolve weight=5 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;  # 多模态请求 / 模板批量导入

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://llm_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Nginx 是边缘入口：用真实对端地址覆盖 XFF，防止客户端伪造 IP 绕过 Key IP 白名单
            # （若前面还有 SLB，请改用 real_ip 模块并把 SLB 网段加入 set_real_ip_from）
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流式输出（SSE）不缓冲；大模型长回复需要较长读超时
            proxy_buffering off;
            proxy_cache off;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 只在请求尚未发到上游（连接失败）时换节点重试，避免重复计费
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
    }
}
