# 入口 Nginx（多主机集群）：放到 /etc/nginx/conf.d/llm-gateway.conf
# 新增从节点：在 upstream 中加一行 server，然后 nginx -s reload

upstream llm_gateway {
    least_conn;
    server 10.0.0.11:8080 weight=3 max_fails=3 fail_timeout=10s;  # gw-master（还承担定时任务）
    server 10.0.0.12:8080 weight=5 max_fails=3 fail_timeout=10s;  # gw-slave-1
    server 10.0.0.13:8080 weight=5 max_fails=3 fail_timeout=10s;  # gw-slave-2
    keepalive 128;
}

server {
    listen 80;
    server_name llm-gateway.example.com;
    # 生产请启用 HTTPS：
    # listen 443 ssl http2;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 50m;

    location / {
        proxy_pass http://llm_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # 本机是边缘入口：覆盖 XFF，避免伪造来源 IP；网关侧 TRUSTED_PROXIES 填本机内网 IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;          # SSE 流式输出
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_next_upstream error timeout;  # POST 已发出后不会重试，避免重复计费
        proxy_next_upstream_tries 2;
    }
}
