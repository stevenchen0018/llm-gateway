# 单机部署：PostgreSQL + Redis + 网关（含控制台）
#   cd deployments/docker && cp .env.example .env && vi .env
#   docker compose up -d --build
#   docker compose --profile demo run --rm seed     # 可选：灌入演示数据
# 访问 http://<host>:${GATEWAY_PORT}  控制台；OpenAI 兼容 API 为 http://<host>:${GATEWAY_PORT}/v1

name: ${COMPOSE_PROJECT_NAME:-llm-gateway}

x-gateway-env: &gateway-env
  TZ: ${TZ:-Asia/Shanghai}
  LLM_GATEWAY_POSTGRES_HOST: postgres
  LLM_GATEWAY_POSTGRES_PORT: "5432"
  LLM_GATEWAY_POSTGRES_USER: llmgateway
  LLM_GATEWAY_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  LLM_GATEWAY_POSTGRES_DBNAME: llmgateway
  LLM_GATEWAY_REDIS_ADDR: redis:6379
  LLM_GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
  LLM_GATEWAY_JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
  LLM_GATEWAY_ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  LLM_GATEWAY_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
  LLM_GATEWAY_LOG_LEVEL: ${LOG_LEVEL:-info}
  LLM_GATEWAY_NOTIFIER_FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
  LLM_GATEWAY_SERVER_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  LLM_GATEWAY_CLUSTER_NODE_TYPE: master
  LLM_GATEWAY_CLUSTER_NODE_NAME: gateway

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      POSTGRES_USER: llmgateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: llmgateway
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgateway -d llmgateway"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  gateway:
    image: ${GATEWAY_IMAGE:-llm-gateway:latest}
    build:
      context: ../..
      dockerfile: deployments/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment: *gateway-env
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }

  # 演示数据（仅空库时写入）：docker compose --profile demo run --rm seed
  seed:
    image: ${GATEWAY_IMAGE:-llm-gateway:latest}
    profiles: ["demo"]
    depends_on:
      gateway: { condition: service_healthy }
    environment: *gateway-env
    entrypoint: ["/usr/local/bin/seed"]

volumes:
  postgres-data:
  redis-data:
