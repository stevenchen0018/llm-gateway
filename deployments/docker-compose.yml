services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: llmgateway
      POSTGRES_PASSWORD: llmgateway
      POSTGRES_DB: llmgateway
    ports:
      - "${LLM_GATEWAY_PG_PORT:-5433}:5432"
    volumes:
      - llm-gateway-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmgateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${LLM_GATEWAY_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  llm-gateway-postgres:
